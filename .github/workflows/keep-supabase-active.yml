name: Keep Supabase Active

on:
  schedule:
    # 毎日 JST 9:00 (UTC 0:00) に実行
    - cron: "0 0 * * *"
  workflow_dispatch: # 手動実行も可能にする

jobs:
  ping-supabase:
    name: Ping Supabase DB
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Ping Supabase via REST API
      env:
        SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      run: |
  echo "Pinging Supabase at $(date '+%Y-%m-%d %H:%M:%S UTC')"
  
  if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
    echo "❌ エラー: シークレットが見つかりません"
    exit 1
  fi
  
  HTTP_STATUS=$(curl -s -i \
    "${SUPABASE_URL}/rest/v1/" \
    -H "apikey: ${SUPABASE_ANON_KEY}" | head -n 1)
  
  echo "Response: ${HTTP_STATUS}"
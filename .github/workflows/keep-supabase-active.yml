run: |
  echo "Pinging Supabase at $(date '+%Y-%m-%d %H:%M:%S UTC')"
  
  if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
    echo "❌ エラー: シークレットが見つかりません"
    exit 1
  fi
  
  HTTP_STATUS=$(curl -s -i \
    "${SUPABASE_URL}/rest/v1/" \
    -H "apikey: ${SUPABASE_ANON_KEY}" | head -n 1)
  
  echo "Response: ${HTTP_STATUS}"